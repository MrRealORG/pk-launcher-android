name: PK Launcher Android CI

# Builds an unsigned-for-store debug APK of PK Launcher for Android on every push.
# Adapted from MojoLauncher's Android CI workflow (LGPL-3.0). Debug builds only:
# no Play Store upload, no release, no tag.

on:
  push:
  workflow_dispatch:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get LTW (MojoLauncher renderer)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa (MojoLauncher drivers)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS || github.token }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.3
          name: mesa-aar
          path: app_mojo/libs

      - name: List bundled renderer libraries
        run: ls -la app_mojo/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        run: |
          mkdir -p out
          gradle :app_mojo:assembleFullDebug
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/pk-launcher-android-debug.apk
          sha256sum out/pk-launcher-android-debug.apk | tee out/pk-launcher-android-debug.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pk-launcher-android-debug
          path: |
            out/pk-launcher-android-debug.apk
            out/pk-launcher-android-debug.sha256
          if-no-files-found: error
